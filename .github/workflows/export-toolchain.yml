name: Export Android build tools for local private signing
on:
  push:
    branches: [jarvis-toolchain-export-20261118]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" || sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download ECJ
        run: curl -fsSL --retry 4 -o "$RUNNER_TEMP/ecj.jar" https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.40.0/ecj-3.40.0.jar
      - name: Pack portable toolchain
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p toolchain/build-tools/35.0.0/lib toolchain/platforms/android-35
          for f in aapt2 zipalign apksigner d8; do cp -L "$ROOT/build-tools/35.0.0/$f" "toolchain/build-tools/35.0.0/$f"; done
          cp -L "$ROOT/build-tools/35.0.0/lib/"*.jar toolchain/build-tools/35.0.0/lib/
          cp -L "$ROOT/build-tools/35.0.0/core-lambda-stubs.jar" toolchain/build-tools/35.0.0/
          cp -L "$ROOT/platforms/android-35/android.jar" toolchain/platforms/android-35/
          cp "$RUNNER_TEMP/ecj.jar" toolchain/ecj.jar
          chmod +x toolchain/build-tools/35.0.0/{aapt2,zipalign,apksigner,d8}
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-private-build-toolchain
          path: toolchain/
          compression-level: 3
          retention-days: 1
