name: Compile JARVIS HUD Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  jarvis-apk:
    name: Android APK debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-hud-apk-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$SDKMANAGER" || { echo "Missing Android sdkmanager"; exit 1; }
          printf 'y\n%.0s' {1..70} | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate HUD and Android source
        run: python3 scripts/verify_hud.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-HUD-10-modules-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then echo "APK missing"; exit 1; fi
          TAG="jarvis-hud-v10-debug"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target jarvis-hud-apk-build --title "JARVIS HUD v10 — Android TEST APK" --prerelease --notes "Debug/test build, not a verified production release. Android permissions and all ten functions require device-level testing."
          fi
      - name: Record verifiable CI build status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_OUTCOME: ${{ job.status }}
        run: |
          set -e
          STATUS_JSON=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "job_status": os.environ.get("CI_OUTCOME","unknown"),
              "source_branch": "jarvis-hud-apk-build",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_url": "https://github.com/"+os.environ.get("GITHUB_REPOSITORY","")+"/actions/runs/"+os.environ.get("GITHUB_RUN_ID",""),
              "test_type": "APK compilation; hardware validation still required",
              "apk_name": "JARVIS-HUD-10-modules-debug-APK"
          }, ensure_ascii=False))
          PY
          )
          ENCODED=$(printf "%s" "$STATUS_JSON" | base64 -w0)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/jarvis-build-status.json?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/docs/jarvis-build-status.json" -f message="Record JARVIS CI result" -f content="$ENCODED" -f branch="main" -f sha="$SHA"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/docs/jarvis-build-status.json" -f message="Record JARVIS CI result" -f content="$ENCODED" -f branch="main"
          fi

  emulator-smoke:
    name: Verify APK launch in Android emulator
    needs: jarvis-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-hud-apk-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-HUD-10-modules-debug-APK
          path: downloaded-apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch JARVIS test app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            APK=$(find downloaded-apk -name '*.apk' | head -n1)
            test -n "$APK" || exit 1
            adb install -r "$APK"
            adb shell am start -W -n com.jarvis.hud/.MainActivity
            sleep 6
            adb shell pidof com.jarvis.hud
            adb exec-out screencap -p > jarvis-emulator-screen.png
            test -s jarvis-emulator-screen.png
      - name: Upload launch screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-android-emulator-screen
          path: jarvis-emulator-screen.png
      - name: Record emulator result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RESULT: ${{ job.status }}
        run: |
          STATUS_JSON=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "emulator_status": os.environ.get("TEST_RESULT","unknown"),
              "test": "Android 35 emulator install, launch, process alive, screenshot",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_url": "https://github.com/"+os.environ.get("GITHUB_REPOSITORY","")+"/actions/runs/"+os.environ.get("GITHUB_RUN_ID",""),
              "hardware_test": False
          }))
          PY
          )
          ENCODED=$(printf "%s" "$STATUS_JSON" | base64 -w0)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/jarvis-emulator-status.json?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/docs/jarvis-emulator-status.json" -f message="Record JARVIS emulator result" -f content="$ENCODED" -f branch=main -f sha="$SHA"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/docs/jarvis-emulator-status.json" -f message="Record JARVIS emulator result" -f content="$ENCODED" -f branch=main
          fi
