name: JARVIS ARC Premium HUD (7.8 Gemini diagnostic)
on:
  push:
    branches: [jarvis-hud76]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve JARVIS ARC signing key for subsequent updates
        uses: actions/cache@v4
        with:
          path: signing.keystore
          key: jarvis-arc-hud76-signer-1
      - name: Verify embedded original HUD and bridge
        run: |
          test -s assets/index.html
          test -s assets/jarvis-bridge.js
          test -s assets/jarvis-brain.js
          grep -q 'getBrain' src/hu/jarvis/app/MainActivity.java
          grep -q 'BrainStore' src/hu/jarvis/app/MainActivity.java
          node --check assets/jarvis-bridge.js
          node --check assets/jarvis-brain.js
          grep -q 'gemini_models' assets/jarvis-bridge.js
          grep -q 'listGeminiModels' src/hu/jarvis/app/MainActivity.java
          grep -q 'validModel' src/hu/jarvis/ai/GeminiConnection.java
          grep -q 'JARVIS' assets/index.html
          grep -q 'JarvisNative' assets/jarvis-bridge.js
      - name: Compile and sign JARVIS ARC APK
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ARC-7.8-GEMINI
          path: build/JARVIS-ARC-7.8.apk
          if-no-files-found: error
