name: Build JARVIS 4.0 Native Offline AI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -f "$SDK/platforms/android-35/android.jar" || { echo 'Missing android-35 platform'; exit 1; }
          for tool in aapt2 d8 zipalign apksigner; do
            test -x "$SDK/build-tools/35.0.0/$tool" || { echo "Missing $tool in build-tools 35.0.0"; exit 1; }
          done
      - name: Install Android NDK and build offline llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724" < /dev/null
          NDK="$SDK/ndk/27.3.13750724"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git native/llama.cpp
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=OFF -DLLAMA_OPENSSL=OFF
          cmake --build native/build --config Release --parallel 2
      - name: Restore persistent JARVIS debug signing key
        uses: actions/cache@v4
        with:
          path: signing.keystore
          key: jarvis-v22-debug-signing-key-1
      - name: Build and sign debug APK
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4.0-native-offline-ai-apk
          path: build/JARVIS-4.0.apk
          if-no-files-found: error
