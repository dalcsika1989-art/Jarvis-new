name: Build JARVIS 2.1 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -f "$SDK/platforms/android-35/android.jar" || { echo 'Missing android-35 platform'; exit 1; }
          for tool in aapt2 d8 zipalign apksigner; do
            test -x "$SDK/build-tools/35.0.0/$tool" || { echo "Missing $tool in build-tools 35.0.0"; exit 1; }
          done
      - name: Build and sign debug APK
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-2.1-debug-apk
          path: build/JARVIS-2.1.apk
          if-no-files-found: error
