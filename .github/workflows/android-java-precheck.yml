name: JARVIS Android Java precheck
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - '.github/workflows/android-java-precheck.yml'
  workflow_dispatch:
jobs:
  precheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android resources and Java (without native build)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/35.0.0"
          AJ="$SDK/platforms/android-35/android.jar"
          test -x "$BT/aapt2"
          test -f "$AJ"
          mkdir -p assets build/generated build/classes
          "$BT/aapt2" compile --dir res -o build/resources-precheck.zip
          "$BT/aapt2" link -o build/precheck.apk -I "$AJ" --manifest AndroidManifest.xml -A assets --java build/generated build/resources-precheck.zip
          mapfile -t sources < <(find src build/generated -type f -name '*.java' | sort)
          javac -source 8 -target 8 -Xlint:-options -classpath "$AJ" -d build/classes "${sources[@]}"
