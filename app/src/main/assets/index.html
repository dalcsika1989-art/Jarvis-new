<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS HUD V5</title><style>*{box-sizing:border-box}body{margin:0;background:#030c17;color:#d7f9ff;font:16px system-ui;text-align:center;padding:20px}header{letter-spacing:4px;color:#00e5ff}#core{width:240px;height:240px;border:5px solid #00e5ff;border-radius:50%;margin:30px auto;box-shadow:0 0 45px #00e5ff55,inset 0 0 35px #00e5ff44;display:grid;place-items:center;animation:pulse 3s infinite}#core span{font-size:85px;color:#00e5ff;text-shadow:0 0 20px #00e5ff}@keyframes pulse{50%{box-shadow:0 0 65px #00e5ff99,inset 0 0 55px #00e5ff77}}button,input{border:1px solid #00e5ff88;background:#092638;color:white;border-radius:12px;padding:15px;font-size:16px;margin:5px}input{width:90%}button{min-width:110px}section{background:#0b1928;border:1px solid #15445b;border-radius:14px;padding:15px;margin:16px 0;text-align:left}small{color:#91b4c5}#output{white-space:pre-wrap;min-height:60px}</style><header>JARVIS HUD V5</header><small>ANDROID NATIVE TEST · AI ENDPOINT NOT CONFIGURED</small><div id="core"><span>△</span></div><button onclick="JarvisNative.listen()">🎙 HALLGATÁS</button><button onclick="speechSynthesis.cancel()">STOP</button><section><b>PARANCS</b><input id="cmd" placeholder="Írj vagy diktálj..."><button onclick="run()">VÉGREHAJTÁS</button><div id="output">Készenlét. A telefonvezérlés korlátozott tesztverzió.</div></section><section><b>ALKALMAZÁSOK</b><div><button onclick="JarvisNative.openApp('com.android.chrome')">CHROME</button><button onclick="JarvisNative.openApp('com.google.android.youtube')">YOUTUBE</button><button onclick="JarvisNative.openApp('com.whatsapp')">WHATSAPP</button></div></section><section><b>MODUL ÁLLAPOT</b><div id="status"></div></section><script>function say(s){try{let u=new SpeechSynthesisUtterance(s);u.lang='hu-HU';speechSynthesis.speak(u)}catch(e){}}function run(){let v=document.getElementById('cmd').value.trim();if(!v)return;let s='Parancs rögzítve: '+v+'. Az AI értelmezéshez külön konfigurált API szükséges.';if(/youtube/i.test(v)){JarvisNative.openApp('com.google.android.youtube');s='YouTube megnyitása kezdeményezve.'}else if(/chrome|böngésző/i.test(v)){JarvisNative.openApp('com.android.chrome');s='Chrome megnyitása kezdeményezve.'}document.getElementById('output').textContent=s;say(s)}window.jarvisResult=function(v){document.getElementById('cmd').value=v;run()};document.getElementById('status').textContent='HUD: ACTIVE | NATÍV INDÍTÁS: TEST | AI: NOT CONFIGURED | ACCESSIBILITY: NOT IMPLEMENTED | GARMIN: NOT IMPLEMENTED';</script></html>
