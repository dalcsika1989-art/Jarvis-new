name: Build JARVIS KILO 3.5 Automatic Operations v2
on:
  push:
    branches: [jarvis-kilo35-auto-operations]
    paths:
      - '.github/workflows/build-jarvis2-kilo-test.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download already-uploaded Kilo test source from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p jarvis2-input
          curl --fail --show-error --silent --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o jarvis2-input/JARVIS-2.0-Kilo-CLOUD-APK-EPITO.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/780371598"
          unzip -tq jarvis2-input/JARVIS-2.0-Kilo-CLOUD-APK-EPITO.zip
      - name: Unpack and check isolated app
        run: |
          unzip -q jarvis2-input/JARVIS-2.0-Kilo-CLOUD-APK-EPITO.zip -d jarvis2-input
          test ! -e jarvis2-input/JARVIS-2.0/signing.keystore
          grep -q 'package="hu.jarvis.kilotest"' jarvis2-input/JARVIS-2.0/AndroidManifest.xml
      - name: Apply isolated controller modifications
        run: |
          python3 .github/scripts/patch_kilo_controller.py jarvis2-input/JARVIS-2.0
          python3 .github/scripts/patch_kilo3.py jarvis2-input/JARVIS-2.0
          cp .github/scripts/kilo3/OnlineSearch.java .github/scripts/kilo3/ApprovalReceiver.java jarvis2-input/JARVIS-2.0/src/hu/jarvis/app/
          python3 .github/scripts/patch_kilo31.py jarvis2-input/JARVIS-2.0
          python3 .github/scripts/patch_kilo32.py jarvis2-input/JARVIS-2.0
          python3 .github/scripts/patch_kilo33.py jarvis2-input/JARVIS-2.0
          python3 .github/scripts/patch_kilo34.py jarvis2-input/JARVIS-2.0
          python3 .github/scripts/patch_kilo35.py jarvis2-input/JARVIS-2.0
          cp .github/scripts/kilo3/TextInputAssist.java .github/scripts/kilo3/SearchActionPolicy.java .github/scripts/kilo3/SearchConstraints.java .github/scripts/kilo3/AutoOperationsPolicy.java jarvis2-input/JARVIS-2.0/src/hu/jarvis/app/
          grep -q 'package="hu.jarvis.kilo35"' jarvis2-input/JARVIS-2.0/AndroidManifest.xml
      - name: Test marketplace safety and exact radius requirements
        run: |
          mkdir -p "$RUNNER_TEMP/kilo34-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/kilo34-tests" \
            jarvis2-input/JARVIS-2.0/src/hu/jarvis/app/AgentRules.java \
            jarvis2-input/JARVIS-2.0/src/hu/jarvis/app/SearchActionPolicy.java \
            jarvis2-input/JARVIS-2.0/src/hu/jarvis/app/SearchConstraints.java \
            .github/scripts/kilo3/Kilo34PolicyTest.java
          java -cp "$RUNNER_TEMP/kilo34-tests" hu.jarvis.app.Kilo34PolicyTest
      - name: Test automatic navigation and exact message authorization
        run: |
          mkdir -p "$RUNNER_TEMP/kilo35-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/kilo35-tests" \
            jarvis2-input/JARVIS-2.0/src/hu/jarvis/app/AgentRules.java \
            jarvis2-input/JARVIS-2.0/src/hu/jarvis/app/AutoOperationsPolicy.java \
            .github/scripts/kilo3/Kilo35PolicyTest.java
          java -cp "$RUNNER_TEMP/kilo35-tests" hu.jarvis.app.Kilo35PolicyTest
      - name: Build test APK
        run: |
          cd jarvis2-input/JARVIS-2.0
          bash BUILD_KILO_APK.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-KILO-3-5-AUTOMATIKUS-MUVELETEK-APK
          path: jarvis2-input/JARVIS-2.0/dist/JARVIS-2.0-KILO-TEST.apk
          if-no-files-found: error
          retention-days: 7
