name: Build JARVIS 2.1 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download Eclipse Java compiler
        run: |
          curl -fL --retry 3 -o /tmp/ecj.jar https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.38.0/ecj-3.38.0.jar
      - name: Build and sign debug APK
        env:
          ECJ_JAR: /tmp/ecj.jar
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-2.1-debug-apk
          path: build/JARVIS-2.1.apk
          if-no-files-found: error
