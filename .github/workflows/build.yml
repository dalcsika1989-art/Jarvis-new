name: Build JARVIS HUD Bridge APK (No API Key)
on:
  push:
    branches: [jarvis-local-hud-bridge]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check HTML script and Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          html=Path('app/src/main/assets/index.html').read_text()
          Path('/tmp/jarvis-hud.js').write_text(re.search(r'<script>(.*?)</script>',html,re.S).group(1))
          for path in Path('app/src/main').rglob('*.xml'): ET.parse(path)
          PY
          node --check /tmp/jarvis-hud.js
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-hud-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
